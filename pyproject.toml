[build-system]
requires = [
  "setuptools>=62.1",
  "setuptools_scm[toml]>=8.0.0",
  "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "casper"
description = "Stellar parameter estimation with CASPER"
requires-python = ">=3.11"
readme = { file = "README.md", content-type = "text/x-rst" }
license = { file = "licenses/LICENSE.rst" }
authors = [
  { name = "Devin D. Whitten", email = "devin.d.whitten@gmail.com" },
  { name = "Jinmi Yoon", email = "jyoon@stsci.edu"},
  { name = "Taylor Webb", email = "taylorw0525@gmail.com" },
]
dependencies = [
    "scipy==1.15.3",
    "numpy==2.3.0",
    "pandas==2.3.0",
    "statsmodels==0.14.4",
    "astropy==7.1.0",
    "emcee==3.1.6",
    "texttable==1.7.0",
    "matplotlib==3.10.3",
    "corner==2.2.3",
    "tqdm>=4.67.1",
]
dynamic = ["version"]

[project.scripts]
open_astronomy_package_template_example = "casper.example_mod:main"

[project.optional-dependencies]
dev = [
    "ruff == 0.11.13",
    "pre-commit == 4.2.0"
]
test = [
    "pytest",
    "pytest-doctestplus",
    "pytest-cov"
]
docs = [
    "sphinx",
    "sphinx-automodapi",
]

all = ["casper[dev, test, docs]"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E4",     # pycodestyle (E4xx): Various style errors (like indentation)
    "E7",     # pycodestyle (E7xx): Statement issues (e.g., multiple statements on one line)
    "E9",     # pycodestyle (E9xx): Syntax errors detected
    "F",      # Pyflakes checks: General code correctness
    "I",      # Import-related checks (e.g., isort ordering)
    "PL",     # Pylint checks (if integrated)
    "C901",   # McCabe complexity check: function too complex
    "RUF010", # Ruff-specific code checks (e.g., invalid `noqa` directives)
    "W291"    # pycodestyle trailing whitespace errors
    ]
ignore = ["PLR"]  # Ignore specific Pylint refactor messages

[project.urls]
repository = "https://github.com/jinmiyoon/new-casper"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["casper*"]

[tool.setuptools_scm]
version_file = "casper/version.py"

[tool.pytest.ini_options]
testpaths = [
  "casper",
  "docs",
]
doctest_plus = "enabled"
text_file_format = "rst"
addopts = "--doctest-rst"
norecursedirs = ["casper[\\/]_dev"]

[tool.coverage.run]
omit = [
 "casper/__init*",
 "casper/conftest.py",
 "casper/*setup_package*",
 "casper/tests/*",
 "casper/*/tests/*",
 "casper/extern/*",
 "casper/version*",
 "*/casper/__init*",
 "*/casper/conftest.py",
 "*/casper/*setup_package*",
 "*/casper/tests/*",
 "*/casper/*/tests/*",
 "*/casper/extern/*",
 "*/casper/version*",
]

[tool.coverage.report]
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",
  # Don't complain about packages we have installed
  "except ImportError",
  # Don't complain if tests don't hit assertions
  "raise AssertionError",
  "raise NotImplementedError",
  # Don't complain about script hooks
  "def main(.*):",
  # Ignore branches that don't pertain to this version of Python
  "pragma: py{ignore_python_version}",
  # Don't complain about IPython completion helper
  "def _ipython_key_completions_",
  # typing.TYPE_CHECKING is False at runtime
  "if TYPE_CHECKING:",
  # Ignore typing overloads
  "@overload",
]
