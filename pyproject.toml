[build-system]
requires = [
  "setuptools>=62.1",
  "setuptools_scm[toml]>=8.0.0",
  "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "casper"
description = "Stellar parameter estimation with CASPER"
requires-python = ">=3.11"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = { file = "licenses/LICENSE.rst" }
authors = [
  { name = "Taylor Webb", email = "taylorw0525@gmail.com" },
]
dependencies = [
    "scipy-1.15.3",
    "numpy-2.3.0",
    "pandas-2.3.0",
    "statsmodels-0.14.4",
    "astropy-7.1.0",
    "emcee-3.1.6",
    "texttable-1.7.0",
    "matplotlib-3.10.3",


 

]
dynamic = ["version"]

[project.scripts]
open_astronomy_package_template_example = "casper.example_mod:main"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-doctestplus",
    "pytest-cov"
]
docs = [
    "sphinx",
    "sphinx-automodapi",
]
[project.urls]
repository = "https://github.com/jinmiyoon/new-casper"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["casper*"]

[tool.setuptools_scm]
version_file = "casper/version.py"

[tool.pytest.ini_options]
testpaths = [
  "casper",
  "docs",
]
doctest_plus = "enabled"
text_file_format = "rst"
addopts = "--doctest-rst"
norecursedirs = ["casper[\\/]_dev"]

[tool.coverage.run]
omit = [
 "casper/__init*",
 "casper/conftest.py",
 "casper/*setup_package*",
 "casper/tests/*",
 "casper/*/tests/*",
 "casper/extern/*",
 "casper/version*",
 "*/casper/__init*",
 "*/casper/conftest.py",
 "*/casper/*setup_package*",
 "*/casper/tests/*",
 "*/casper/*/tests/*",
 "*/casper/extern/*",
 "*/casper/version*",
]

[tool.coverage.report]
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",
  # Don't complain about packages we have installed
  "except ImportError",
  # Don't complain if tests don't hit assertions
  "raise AssertionError",
  "raise NotImplementedError",
  # Don't complain about script hooks
  "def main(.*):",
  # Ignore branches that don't pertain to this version of Python
  "pragma: py{ignore_python_version}",
  # Don't complain about IPython completion helper
  "def _ipython_key_completions_",
  # typing.TYPE_CHECKING is False at runtime
  "if TYPE_CHECKING:",
  # Ignore typing overloads
  "@overload",
]
